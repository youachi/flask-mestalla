{% extends 'base.html' %}
{% block titulo %}Mi cuenta{% endblock %}

{% block contenido %}
<div class="columnas columnas--2">
    <form method="POST" action="{{ url_for('acceder') }}" class="formulario caja">
        <h2>Acceder</h2>
        <label for="usuario">Nombre de usuario o correo electrónico *</label>
        <input type="text" id="usuario" name="usuario" required autocomplete="username">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <button type="submit" class="boton">Acceder</button>
    </form>

    <form method="POST" action="{{ url_for('registro') }}" class="formulario caja">
        <h2>Registrarse</h2>
        <label for="r-usuario">Nombre de usuario *</label>
        <input type="text" id="r-usuario" name="usuario" required autocomplete="username">
        <label for="r-nombre">Nombre y apellidos</label>
        <input type="text" id="r-nombre" name="nombre" autocomplete="name">
        <label for="r-email">Correo electrónico *</label>
        <input type="email" id="r-email" name="email" required autocomplete="email">
        <label for="r-password">Contraseña *</label>
        <input type="password" id="r-password" name="password" required minlength="6" autocomplete="new-password">
        <p class="nota">Tus datos personales se utilizarán para gestionar el acceso a tu cuenta, tal y como se describe en nuestra
            <a href="{{ url_for('politica_privacidad') }}">política de privacidad</a>.</p>
        <button type="submit" class="boton">Registrarse</button>
    </form>
</div>
{% endblock %}
